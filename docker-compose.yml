# 默认只起应用容器,只监听 127.0.0.1:8000,由宿主机上的 Nginx / 宝塔面板反代。
# 独立服务器上想用自带的 Caddy 自动签证书,叠加 docker-compose.caddy.yml:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # 生产必须换掉:泄露即等于任何人都能伪造登录态
      SNIPE_SECRET_KEY: ${SNIPE_SECRET_KEY:?请在 .env 中设置 SNIPE_SECRET_KEY}
      # 对外走 HTTPS 时必须为 true,Cookie 才带 Secure(PRD 3.7)
      SNIPE_COOKIE_SECURE: ${SNIPE_COOKIE_SECURE:-true}
      SNIPE_INITIAL_ADMIN_USERNAME: ${SNIPE_INITIAL_ADMIN_USERNAME:-admin}
      SNIPE_INITIAL_ADMIN_PASSWORD: ${SNIPE_INITIAL_ADMIN_PASSWORD:?请在 .env 中设置初始管理员密码}
    volumes:
      # SQLite 数据库 + 将来的设备照片。备份就是备份这个目录(PRD 第 4 节)
      - snipe-data:/data
    ports:
      # 只绑回环:容器不直接对公网,一律经反代进来
      - "127.0.0.1:${SNIPE_PORT:-8000}:8000"

volumes:
  snipe-data:
